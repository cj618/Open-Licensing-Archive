# Source registry

authoritative_baselines:
  - id: spdx-license-list
    name: SPDX License List
    url: https://spdx.org/licenses/
    use: Standard identifiers, canonical URLs, licence texts, FSF free/libre flag, OSI approval flag, and exception identifiers.
    notes: Use for cross-reference and identifier consistency, not as a substitute for historical source-tree provenance.

  - id: osi-license-list
    name: Open Source Initiative licence list
    url: https://opensource.org/license
    use: OSI approval status and approved licence texts.
    notes: Use for open-source approval status. Do not assume OSI approval for historical variants unless specifically listed.

  - id: gnu-license-list
    name: GNU Project / FSF licence commentary
    url: https://www.gnu.org/licenses/license-list.html
    use: FSF commentary on whether licences are free software licences and whether they are GPL-compatible.
    notes: Useful for free-software classification and compatibility notes.

  - id: scancode-licensedb
    name: ScanCode LicenseDB
    url: https://scancode-licensedb.aboutcode.org/
    use: Variant discovery and text comparison.
    notes: Treat as a structured secondary baseline unless it points to a stronger primary source.

  - id: software-heritage
    name: Software Heritage
    url: https://www.softwareheritage.org/
    use: Source-tree and release provenance.
    notes: Useful for historical source snapshots and verifying exact source-tree notices.

